[package]
name = "trace-iceberg"
version = "0.1.0"
edition = "2021"
description = "Apache Iceberg table writer for TRACE - real table metadata, Avro manifests, snapshots, migration, and REST catalog client"

[dependencies]
anyhow = "1.0"
bytes = "1.8"
apache-avro = "0.22"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
parquet = { version = "54", features = ["arrow"] }
arrow = { version = "54", features = ["chrono-tz"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
