apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-compactor
  namespace: trace
  labels:
    app: trace-compactor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-compactor
  template:
    metadata:
      labels:
        app: trace-compactor
    spec:
      containers:
        - name: compactor
          image: ghcr.io/jedarden/trace-compactor:v0.1.0
          imagePullPolicy: Always
          env:
            - name: TRACE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: bucket
            - name: TRACE_S3_REGION
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: region
            - name: TRACE_S3_PREFIX
              value: trace-events
            - name: COMPACTOR_LOOKBACK_DAYS
              value: "7"
            - name: COMPACTOR_INTERVAL_SECONDS
              value: "86400"
            - name: ICEBERG_COMPACTION
              # The current job only appends output files. Keep off until the
              # migration and atomic snapshot rewrite cutover is complete.
              value: "false"
            - name: ICEBERG_CATALOG_URI
              valueFrom:
                configMapKeyRef:
                  name: trace-config
                  key: iceberg-catalog-uri
                  optional: true
            - name: ICEBERG_WAREHOUSE
              valueFrom:
                configMapKeyRef:
                  name: trace-config
                  key: iceberg-warehouse
                  optional: true
            - name: TRACE_ICEBERG_PUBLISH
              value: "false"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: secret-access-key
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
