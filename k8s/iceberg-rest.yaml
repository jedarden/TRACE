apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trace-iceberg-catalog
  namespace: trace
  labels:
    app: trace-iceberg-rest
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-iceberg-rest
  namespace: trace
  labels:
    app: trace-iceberg-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trace-iceberg-rest
  template:
    metadata:
      labels:
        app: trace-iceberg-rest
    spec:
      containers:
        - name: iceberg-rest
          image: tabulario/iceberg-rest:1.6.0
          imagePullPolicy: IfNotPresent
          env:
            - name: CATALOG_CATALOG__IMPL
              value: org.apache.iceberg.jdbc.JdbcCatalog
            - name: CATALOG_URI
              value: jdbc:sqlite:/var/lib/iceberg/catalog.db
            - name: CATALOG_WAREHOUSE
              value: s3://my-trace-bucket/trace-events/iceberg
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_CLIENT_REGION
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: region
            - name: CATALOG_S3_PATH__STYLE_ACCESS
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: secret-access-key
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: trace-s3-credentials
                  key: region
          ports:
            - name: rest
              containerPort: 8181
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/config
              port: rest
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/config
              port: rest
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          volumeMounts:
            - name: catalog-state
              mountPath: /var/lib/iceberg
      volumes:
        - name: catalog-state
          persistentVolumeClaim:
            claimName: trace-iceberg-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
  namespace: trace
  labels:
    app: trace-iceberg-rest
spec:
  type: ClusterIP
  selector:
    app: trace-iceberg-rest
  ports:
    - name: rest
      port: 8181
      targetPort: rest
      protocol: TCP
